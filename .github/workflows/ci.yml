name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: unihub
          POSTGRES_PASSWORD: unihub
          POSTGRES_DB: unihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://unihub:unihub@localhost:5432/unihub

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  # the server's stack starts: migrations, then the app passes its health check
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          cat > deploy/.env <<EOF
          DOMAIN=localhost
          POSTGRES_PASSWORD=ci
          BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret
          BETTER_AUTH_URL=https://localhost
          SMTP_URL=smtp://u:p@localhost:587
          EOF
      - run: docker compose -f deploy/compose.yml up --build --wait app
      - if: failure()
        run: docker compose -f deploy/compose.yml logs
