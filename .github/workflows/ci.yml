name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: unihub
          POSTGRES_PASSWORD: unihub
          POSTGRES_DB: unihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
      # as in docker-compose.yml
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
          action.auto_create_index: '-unihub-*,+*'
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS localhost:9200/_cluster/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://unihub:unihub@localhost:5432/unihub

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  # the web app (web/), a project of its own; the image builds it again
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run steiger
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # the API's types are the ones web/openapi.json gives
      - run: npm run api:generate && git diff --exit-code src/shared/api/schema.d.ts

  # the server's stack starts: migrations, then the app passes its health check
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          cat > deploy/.env <<EOF
          DOMAIN=localhost
          POSTGRES_PASSWORD=ci
          BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret
          BETTER_AUTH_URL=https://localhost
          SMTP_URL=smtp://u:p@localhost:587
          EOF
      - run: docker compose -f deploy/compose.yml up --build --wait app
      # the same image as a worker (README, Running the API and the worker
      # apart): it serves nothing, so it's up once it logs so
      - run: |
          docker compose -f deploy/compose.yml run --no-deps -d --name worker -e APP_ROLE=worker app
          timeout 60 sh -c 'until docker logs worker 2>&1 | grep -q "worker started"; do sleep 1; done'
      - if: failure()
        run: |
          docker compose -f deploy/compose.yml logs
          docker logs worker || true
