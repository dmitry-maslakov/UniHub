name: Release

# the images of every commit CI passed on main, tagged with its sha, for a
# deployment to pull. The registry and its login are repo secrets; without
# REGISTRY (forks) nothing is built. No manual trigger: it could publish a
# commit off main or one CI hasn't passed; to publish a commit again, re-run
# its Release run (or CI on main)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  # the build record is an artifact anyone can download, and it isn't masked
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  # secrets can't be read in a job's `if`
  registry:
    # a pull request's run never publishes, one from a fork's main included
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      set: ${{ steps.registry.outputs.set }}
    steps:
      - id: registry
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
        run: echo "set=${REGISTRY:+true}" >> "$GITHUB_OUTPUT"

  images:
    needs: registry
    if: needs.registry.outputs.set == 'true'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      # an image is as new as its commit, so the newest is the newest commit's
      # even when CI runs finish out of order
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.REGISTRY }}/unihub/app:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the build stage, which deploy/compose.yml runs the migrations with
      - name: migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: build
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.REGISTRY }}/unihub/migrate:${{ env.SHA }}
          cache-from: type=gha
