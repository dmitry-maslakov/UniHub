name: Release

# the images of every commit CI passed on main, tagged with its full sha, in
# GitHub's container registry (ghcr.io/dmitry-maslakov/unihub and
# unihub-migrate) for a deployment to pull. The workflow's own token logs in;
# a fork builds nothing. No manual trigger: it could publish a commit off main
# or one CI hasn't passed; to publish a commit again, re-run its Release run
# (or CI on main)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  # the build record is an artifact anyone can download, and it isn't masked
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  images:
    # a pull request's run never publishes, one from a fork's main included
    if: >-
      github.repository == 'dmitry-maslakov/UniHub' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      # an image is as new as its commit, so the newest is the newest commit's
      # even when CI runs finish out of order
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: COMMIT_SHA=${{ env.SHA }}
          tags: ghcr.io/dmitry-maslakov/unihub:${{ env.SHA }}
          # links the package to this repo
          labels: org.opencontainers.image.source=https://github.com/dmitry-maslakov/UniHub
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # the build stage, which deploy/compose.yml runs the migrations with
      - name: migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: build
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/dmitry-maslakov/unihub-migrate:${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/dmitry-maslakov/UniHub
          cache-from: type=gha
