// How an external connector sends data to the hub. Every call carries
// `authorization: Bearer <token>` metadata; the token decides the portal.
// Ids are the portal's own, json fields are json text.
// One sync per portal at a time is the connector's job: with two running,
// the last SaveState wins.
// A call the hub refuses carries the standard google.rpc.Status in the
// grpc-status-details-bin trailer, with a google.rpc.ErrorInfo whose domain
// is "unihub" and whose reason (FILE_COURSE_MISMATCH, UNKNOWN_REFERENCE...)
// never changes.

syntax = "proto3";

package unihub.ingest.v1;

import "google/protobuf/timestamp.proto";

service Ingest {
  rpc Course (CourseRecord) returns (Changed);
  rpc Item (ItemRecord) returns (Changed);
  rpc File (FileRecord) returns (FileResult);
  // external_id of a file already sent with File, then data, then sha256.
  // Content past the hub's limit for one file is refused with
  // INVALID_ARGUMENT, and so is every resend: send it again only once File
  // answers changed for that file
  rpc Content (stream ContentChunk) returns (ContentResult);
  // the portal no longer has it; sending it again brings it back
  rpc RemoveItem (Ref) returns (Changed);
  rpc RemoveFile (Ref) returns (Changed);
  rpc GetState (Empty) returns (State);
  // "null" saves null: GetState answers as if none was ever saved
  rpc SaveState (State) returns (Empty);
  // The courses of the portal's catalog its users want synced: picked now,
  // or within 14 days of their last pick going. Of a portal the hub reads
  // as public, whose connector sends its whole catalog as courses, and
  // items and files of these alone; none of another portal. Nothing of who
  // picked them, or how many. A course no longer wanted is kept as it was,
  // not removed, its state too, so a pick later goes on from there
  rpc Wanted (Empty) returns (WantedCourses);
}

message Empty {}

message Changed {
  bool changed = 1;
}

message CourseRecord {
  string external_id = 1;
  string name = 2;
  optional string url = 3;
  optional string meta_json = 4;
}

message ItemRecord {
  string external_id = 1;
  optional string course = 2;
  string kind = 3;
  optional string title = 4;
  optional string url = 5;
  google.protobuf.Timestamp published_at = 6;
  string raw_json = 7;
}

message FileRecord {
  string external_id = 1;
  optional string course = 2;
  optional string item = 3;
  string name = 4;
  optional string path = 5;
  optional string url = 6;
  optional int64 size = 7;
  optional string mime = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message FileResult {
  bool changed = 1;
  // the hub has no content for it yet, or it may have changed. False for a
  // size past the hub's limit for one file: Content would be refused
  bool needs_content = 2;
}

message ContentChunk {
  oneof part {
    string external_id = 1;
    // gRPC takes messages up to 4 MB, so send the bytes in smaller pieces
    bytes data = 2;
    // hex sha256 of all the data. Nothing is stored without it, so an upload
    // cut off halfway never passes for the whole file; DATA_LOSS on mismatch
    string sha256 = 3;
  }
}

message ContentResult {
  string hash = 1;
  bool changed = 2;
}

message Ref {
  string external_id = 1;
}

message State {
  // null when the connector never saved one
  optional string json = 1;
}

message WantedCourses {
  // the courses' ids, as Course sent them
  repeated string external_ids = 1;
}
