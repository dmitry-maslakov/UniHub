# The hub on one server: caddy (TLS) in front of the app, postgres, redis;
# with the search profile, OpenSearch and the models too.
# Settings in deploy/.env (see README).
name: unihub

# docker's default logs grow until the disk (the database's, the files') is full
x-logging: &logging
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: '5'

# the search profile's model servers, each a TEI on the CPU
x-tei: &tei
  <<: *logging
  profiles: [search]
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
  restart: unless-stopped
  mem_limit: 3g
  healthcheck: &tei-health
    test: ['CMD', 'curl', '-fsS', 'http://localhost/health']
    interval: 10s
    start_period: 300s

services:
  caddy:
    <<: *logging
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *logging
    build: ..
    restart: unless-stopped
    # a real init as PID 1: signals and child processes handled properly
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://unihub:${POSTGRES_PASSWORD}@postgres:5432/unihub
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /app/data/blobs
      # only caddy reaches it, over the compose network
      GRPC_URL: 0.0.0.0:50051
      TRUST_PROXY: 1
    volumes:
      - blobs:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      start_period: 30s
    # queue jobs get time to finish on a restart
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # applies the migrations, then exits; the app starts after it. The outbox
  # keeps its own schema (nest_outbox), which it migrates itself only outside
  # production
  migrate:
    <<: *logging
    build:
      context: ..
      target: build
    command:
      - sh
      - -c
      - npx prisma migrate deploy && npx @nestjs/outbox migrate
    # the build image has the dev tools too, for one-off tasks (the first admin)
    env_file: .env
    environment:
      DATABASE_URL: postgresql://unihub:${POSTGRES_PASSWORD}@postgres:5432/unihub
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *logging
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: unihub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: unihub
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'unihub']
      interval: 5s

  redis:
    <<: *logging
    image: redis:8
    restart: unless-stopped
    # jobs live only in redis, keep them across restarts
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data

  # search (README, Deploying search): on with COMPOSE_PROFILES=search in
  # deploy/.env. The app waits for none of these: until they're up indexing
  # waits, and a search is a 503, or by the words alone while the embedders
  # are away
  opensearch:
    <<: *logging
    profiles: [search]
    image: opensearchproject/opensearch:3.9.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # only the compose network reaches it, like redis
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-2g} -Xmx${OPENSEARCH_HEAP:-2g}
      # a lost index fails the write instead of coming back with a dynamic mapping
      action.auto_create_index: '-unihub-*,+*'
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      memlock: { soft: -1, hard: -1 }
    mem_limit: 4g
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"']
      interval: 10s
      start_period: 60s

  # indexing: batches of chunks. Given half an hour to come up, as the first
  # start downloads the model (2.3 GB) into models first, and embedder-query
  # waits for it
  embedder:
    <<: *tei
    command: &bge-m3 [--model-id, BAAI/bge-m3, --revision, 5617a9f61b028005a4858fdac845db406aefb181,
                      --max-batch-tokens, '2048', --max-client-batch-size, '64', --tokenization-workers, '2', --json-output]
    # docker refuses more than the server's cores
    cpus: ${TEI_CPUS:-6}
    volumes: [models:/data]
    healthcheck: { <<: *tei-health, start_period: 30m }

  # queries: the embedder's command, so the same model, revision and
  # EMBEDDING_MODEL, on a server of its own, so a search never waits behind
  # indexing (TEI's queue is first come, first served). It starts once the
  # embedder is up: a TEI that finds another downloading the weights into
  # models gives up on them after 5 s and starts on another backend, from
  # another copy (2.3 GB more), its vectors a little off
  embedder-query:
    <<: *tei
    command: *bge-m3
    cpus: 2
    volumes: [models:/data]
    depends_on: { embedder: { condition: service_healthy } }

  # puts the int8 reranker where TEI looks (onnx/model.onnx), as in
  # docker-compose.yml; a no-op, offline, once it's there
  reranker-init:
    <<: *logging
    profiles: [search]
    image: python:3.13-slim@sha256:ae14d4ce8771606477a81446e7ef429edd6762305fc50c84507c1041fa8285d1
    command:
      - sh
      - -c
      - >-
        test -f /data/bge-reranker-v2-m3-int8/onnx/model.onnx && exit 0;
        pip install --no-cache-dir --root-user-action=ignore -q
        'huggingface_hub==1.10.2' 'typer==0.24.1' 'click==8.3.2' &&
        hf download onnx-community/bge-reranker-v2-m3-ONNX --revision 6f5ff65298512715a1e669753bc754d2bc8f367b
        --include '*.json' --include onnx/model_int8.onnx --local-dir /data/src/bge-reranker-v2-m3 &&
        mkdir -p /data/bge-reranker-v2-m3-int8/onnx &&
        cp /data/src/bge-reranker-v2-m3/*.json /data/bge-reranker-v2-m3-int8/ &&
        ln -f /data/src/bge-reranker-v2-m3/onnx/model_int8.onnx /data/bge-reranker-v2-m3-int8/onnx/model.onnx
    volumes: [models:/data]

  # the int8 model reranker-init put there
  reranker:
    <<: *tei
    command: [--model-id, /data/bge-reranker-v2-m3-int8, --max-batch-tokens, '1024', --max-client-batch-size, '64',
              --tokenization-workers, '2', --json-output]
    cpus: ${TEI_CPUS:-6}
    volumes: [models:/data:ro]
    healthcheck: { <<: *tei-health, start_period: 120s }
    depends_on: { reranker-init: { condition: service_completed_successfully } }

volumes:
  caddydata:
  caddyconfig:
  pgdata:
  redisdata:
  blobs:
  osdata:
  models:
