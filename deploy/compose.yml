# The hub on one server: caddy (TLS) in front of the app, postgres, redis;
# with the search profile, OpenSearch and the models too.
# Settings in deploy/.env (see README).
name: unihub

# docker's default logs grow until the disk (the database's, the files') is full
x-logging: &logging
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: '5'

# the search profile's model servers: TEI on the CPU, extending
# docker-compose.yml's, so the models, their revisions and TEI_TAG are pinned
# there once. Each resets the ports it extends: a merge key drops the tag
x-tei: &tei
  <<: *logging
  profiles: [search]
  restart: unless-stopped
  mem_limit: 3g
  # none unless set: docker refuses a limit past the server's cores
  cpus: ${TEI_CPUS:-0}
  healthcheck: &tei-health
    test: ['CMD', 'curl', '-fsS', 'http://localhost/health']
    interval: 10s
    start_period: 300s

services:
  caddy:
    <<: *logging
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *logging
    build: ..
    restart: unless-stopped
    # a real init as PID 1: signals and child processes handled properly
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://unihub:${POSTGRES_PASSWORD}@postgres:5432/unihub
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /app/data/blobs
      # only caddy reaches it, over the compose network
      GRPC_URL: 0.0.0.0:50051
      TRUST_PROXY: 1
    volumes:
      - blobs:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      start_period: 30s
    # queue jobs get time to finish on a restart
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # applies the migrations, then exits; the app starts after it. The outbox
  # keeps its own schema (nest_outbox), which it migrates itself only outside
  # production
  migrate:
    <<: *logging
    build:
      context: ..
      target: build
    command:
      - sh
      - -c
      - npx prisma migrate deploy && npx @nestjs/outbox migrate
    # the build image has the dev tools too, for one-off tasks (the first admin)
    env_file: .env
    environment:
      DATABASE_URL: postgresql://unihub:${POSTGRES_PASSWORD}@postgres:5432/unihub
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *logging
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: unihub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: unihub
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'unihub']
      interval: 5s

  redis:
    <<: *logging
    image: redis:8
    restart: unless-stopped
    # jobs live only in redis, keep them across restarts
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data

  # search (README, Deploying search): on with COMPOSE_PROFILES=search in
  # deploy/.env. The app waits for none of these: until they're up indexing
  # waits, and a search is a 503, or by the words alone while the embedders
  # are away
  opensearch:
    extends: { file: ../docker-compose.yml, service: opensearch }
    <<: *logging
    profiles: [search]
    restart: unless-stopped
    # only the compose network reaches it, like redis
    ports: !reset []
    environment:
      # at most half its memory: the rest is for Lucene's files, the vectors'
      # graphs among them
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-2g} -Xmx${OPENSEARCH_HEAP:-2g}
      # with the memlock ulimit, the heap is never swapped out
      bootstrap.memory_lock: 'true'
    mem_limit: ${OPENSEARCH_MEMORY:-4g}
    healthcheck:
      interval: 10s
      start_period: 60s

  # indexing: batches of chunks. Given half an hour to come up, as the first
  # start downloads the model (2.3 GB) into models first, and embedder-query
  # waits for it
  embedder:
    extends: { file: ../docker-compose.yml, service: embedder }
    <<: *tei
    ports: !reset []
    healthcheck: { <<: *tei-health, start_period: 30m }

  # queries: the embedder's model, revision and EMBEDDING_MODEL on a server of
  # its own, so a search never waits behind indexing (TEI's queue is first
  # come, first served). It starts once the embedder is up: a TEI that finds
  # another downloading the weights into models gives up on them after 5 s and
  # starts on another backend, from another copy (2.3 GB more), its vectors a
  # little off
  embedder-query:
    extends: { file: ../docker-compose.yml, service: embedder }
    <<: *tei
    ports: !reset []
    depends_on: { embedder: { condition: service_healthy } }

  # puts the int8 reranker where TEI looks; a no-op, offline, once it's there
  reranker-init:
    extends: { file: ../docker-compose.yml, service: reranker-init }
    <<: *logging
    profiles: [search]

  # the int8 model reranker-init put there, once it has
  reranker:
    extends: { file: ../docker-compose.yml, service: reranker }
    <<: *tei
    ports: !reset []
    healthcheck: { <<: *tei-health, start_period: 120s }

volumes:
  caddydata:
  caddyconfig:
  pgdata:
  redisdata:
  blobs:
  osdata:
  models:
