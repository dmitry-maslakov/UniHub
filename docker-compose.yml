services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: unihub
      POSTGRES_PASSWORD: unihub
      POSTGRES_DB: unihub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8
    # jobs live only in redis, keep them across restarts
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  # search; no security plugin: never on the network
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      # a lost index fails the write instead of coming back with a dynamic mapping
      action.auto_create_index: '-unihub-*,+*'
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      memlock: { soft: -1, hard: -1 }
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"']
      interval: 5s
      retries: 40

  # search by meaning (README, Search index): docker compose --profile models up -d
  embedder:
    profiles: [models]
    # a tag per arch: TEI_TAG=cpu-arm64-1.9.4 on Apple silicon (.env.example)
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_TAG:-cpu-1.9.4}
    command: [--model-id, '${EMBED_MODEL_ID:-BAAI/bge-m3}', --revision, '${EMBED_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}',
              --max-batch-tokens, '2048', --max-client-batch-size, '64', --tokenization-workers, '2', --json-output]
    ports: ['127.0.0.1:8081:80']
    volumes: [models:/data]

volumes:
  pgdata:
  redisdata:
  osdata:
  models:
