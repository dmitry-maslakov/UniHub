# local development. deploy/compose.yml extends opensearch and the models'
# services, so what they set here runs on the server too, all but the ports
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: unihub
      POSTGRES_PASSWORD: unihub
      POSTGRES_DB: unihub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8
    # jobs live only in redis, keep them across restarts
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  # search; no security plugin: never on the network
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      # a lost index fails the write instead of coming back with a dynamic mapping
      action.auto_create_index: '-unihub-*,+*'
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      memlock: { soft: -1, hard: -1 }
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"']
      interval: 5s
      retries: 40

  # search by meaning (README, Search index): docker compose --profile models up -d
  embedder:
    profiles: [models]
    # a tag per arch: TEI_TAG=cpu-arm64-1.9.4 on Apple silicon (.env.example)
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_TAG:-cpu-1.9.4}
    command: [--model-id, '${EMBED_MODEL_ID:-BAAI/bge-m3}', --revision, '${EMBED_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}',
              --max-batch-tokens, '2048', --max-client-batch-size, '64', --tokenization-workers, '2', --json-output]
    ports: ['127.0.0.1:8081:80']
    volumes: [models:/data]

  # puts the int8 reranker where TEI looks (onnx/model.onnx); a no-op,
  # offline, once it's there. huggingface_hub's hf needs click, which the
  # newest typer no longer brings: both pinned
  reranker-init:
    profiles: [models]
    image: python:3.13-slim@sha256:ae14d4ce8771606477a81446e7ef429edd6762305fc50c84507c1041fa8285d1
    command:
      - sh
      - -c
      - >-
        test -f /data/bge-reranker-v2-m3-int8/onnx/model.onnx && exit 0;
        pip install --no-cache-dir --root-user-action=ignore -q
        'huggingface_hub==1.10.2' 'typer==0.24.1' 'click==8.3.2' &&
        hf download onnx-community/bge-reranker-v2-m3-ONNX --revision 6f5ff65298512715a1e669753bc754d2bc8f367b
        --include '*.json' --include onnx/model_int8.onnx --local-dir /data/src/bge-reranker-v2-m3 &&
        mkdir -p /data/bge-reranker-v2-m3-int8/onnx &&
        cp /data/src/bge-reranker-v2-m3/*.json /data/bge-reranker-v2-m3-int8/ &&
        ln -f /data/src/bge-reranker-v2-m3/onnx/model_int8.onnx /data/bge-reranker-v2-m3-int8/onnx/model.onnx
    volumes: [models:/data]

  # the int8 ONNX one: BAAI/bge-reranker-v2-m3 itself runs on candle on
  # arm64, where 50 texts of 1 KB took 110 s
  reranker:
    profiles: [models]
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_TAG:-cpu-1.9.4}
    command: [--model-id, /data/bge-reranker-v2-m3-int8, --max-batch-tokens, '1024', --max-client-batch-size, '64',
              --tokenization-workers, '2', --json-output]
    ports: ['127.0.0.1:8082:80']
    volumes: [models:/data:ro]
    depends_on: { reranker-init: { condition: service_completed_successfully } }

volumes:
  pgdata:
  redisdata:
  osdata:
  models:
