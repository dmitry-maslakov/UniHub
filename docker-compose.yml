services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: unihub
      POSTGRES_PASSWORD: unihub
      POSTGRES_DB: unihub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8
    # jobs live only in redis, keep them across restarts
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
